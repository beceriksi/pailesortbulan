name: OKX Gemini Bot Scanner

on:
  schedule:
    # Her saat başı otomatik çalışır (Dakika Saat Gün Ay Gün_Hafta)
    # UTC saatine göredir. Türkiye saati için kafandan hesaplayabilirsin.
    - cron: '0 * * * *'
  workflow_dispatch: # Bu satır, istediğin an elinle de bota start vermeni sağlar.

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Tarayıcıyı (Playwright) Kur
      run: |
        playwright install chromium
        playwright install-deps chromium

    - name: Botu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py
