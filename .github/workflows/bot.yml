name: Crypto Scanner Bot

on:
  schedule:
    # Her 1 saatte bir otomatik çalışır (İstersen süreyi değiştirebilirsin)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub panelinden elle (manuel) tetiklemek için

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Hızlı çalışması için önbellekleme yapar

    - name: Gerekli Kütüphaneleri Kur
      run: |
        python - lobbyists install --upgrade pip
        pip install -r requirements.txt

    - name: Playwright Sistem Bağımlılıklarını ve Tarayıcıyı Kur
      run: |
        # Ekran görüntüsü alabilmek için sanal tarayıcıyı ayağa kaldırır
        playwright install chromium --with-deps

    - name: Botu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python main.py
