name: Gem Hunter Bot

on:
  schedule:
    # her 15 dakikada bir çalışır (UTC). İhtiyacına göre değiştir.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # manuel tetikleme imkanı (Actions sekmesinden "Run workflow")

# Aynı anda iki çalıştırmanın çakışıp signals_log.csv'yi bozmaması için
concurrency:
  group: gem-hunter-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Playwright tarayıcısını kur
        run: playwright install chromium --with-deps

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gem_hunter_bot.py

      - name: Durum dosyalarını commit'le (signals_log.csv, daily_report_state.json)
        run: |
          git config user.name "gem-hunter-bot"
          git config user.email "actions@github.com"
          git add signals_log.csv daily_report_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: bot state güncellendi [skip ci]"
          git push
