name: Crypto SR & Trend Scanner Bot

on:
  schedule:
    # Her 1 saatte bir otomatik çalışır (CRON UTC cinsindendir)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub üzerinden elle (manuel) tetikleme seçeneği

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkların Yüklenmesi
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pillow google-genai playwright pypdf openpyxl
          playwright install chromium
          playwright install-deps

      - name: Sinyal Log Geçmişini Cache/Artifact ile Sakla
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Tarama ve Entegrasyon Botunu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Sinyal Log Dosyasını (CSV) Güncelle ve Depoya Commit Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add signals_log.csv || true
          git commit -m "auto: update signals_log.csv [skip ci]" || true
          git push || true
